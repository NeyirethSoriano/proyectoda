services:

  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: proxy-manager
    restart: always
    ports:
      - "80:80" #Http
      - "81:81" #Administración de la API
      - "443:443" #Https
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    networks:
      - red-cba

  backend:
    build: .
    container_name: backend
    restart: always

    ports:
      - "5050:5050"

    env_file:
      - .env

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5050/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

    networks:
      - red-cba

networks:
  red-cba:
    name: red-cba