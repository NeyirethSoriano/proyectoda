services:

  nginx:
    image: nginx:alpine
    container_name: proxy-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - red-cba

  backend:
    build: .
    container_name: backend
    restart: always

    ports:
      - "5050:5050"

    env_file:
      - .env

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5050/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

    networks:
      - red-cba

networks:
  red-cba:
    name: red-cba